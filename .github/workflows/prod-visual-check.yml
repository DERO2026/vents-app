# Throwaway: mobile visual check of the live getvents.com (guest pages only).
# Runs only on pushes to this branch; results are encrypted to
# prod-check/recipient.crt and committed back. Never merged to main.
name: Production visual check
on:
  push:
    branches: [claude/prod-visual-check]
    paths: [prod-check/check.mjs, .github/workflows/prod-visual-check.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Playwright
        working-directory: prod-check
        run: npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Check getvents.com
        working-directory: prod-check
        run: node check.mjs
      - name: Encrypt and commit results
        working-directory: prod-check
        run: |
          set -euo pipefail
          tar czf results.tgz out
          openssl cms -encrypt -binary -aes256 -in results.tgz -outform DER -out results.cms recipient.crt
          rm -rf out results.tgz node_modules package*.json
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.cms && git commit -m "prod visual check results (encrypted)" && git push
