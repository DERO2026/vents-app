[auth]
allowed_redirect_urls = ["http://localhost:3000", "http://localhost:3001", "http://localhost:5173", "http://localhost:5175", "http://localhost:5176", "http://localhost:5177", "http://localhost:5178", "http://localhost:5179", "http://localhost:5180", "https://getvents.com"]
require_email_verification = true
verify_email_method = "code"
reset_password_method = "code"
disable_signup = false

[auth.password]
min_length = 10
require_number = true
require_lowercase = true
require_uppercase = true
require_special_char = false

[auth.smtp]
enabled = true
host = "smtp.gmail.com"
port = 587
username = "support@getvents.com"
# password is managed via secrets — run `insforge secrets add SMTP_PASSWORD "<value>"`
password = "env(SMTP_PASSWORD)"
sender_email = "support@getvents.com"
sender_name = "VENTS"
min_interval_seconds = 60

[storage]
max_file_size_mb = 50

[realtime]
retention_days = 0

[schedules]
retention_days = 7
