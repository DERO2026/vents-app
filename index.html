
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <style>
        html, body {
          background-color: #060A14 !important;
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          overscroll-behavior-y: none;
        }
      </style>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
      <title>VENTS</title>
      <meta name="description" content="Discover and book events in Nigeria with a user-friendly platform that offers ticket purchasing, event categories, and personalized recommendations." />
      <meta name="robots" content="index, follow" />

      <!-- Favicons / site icons -->
      <link rel="icon" href="/favicon.ico" sizes="any" />
      <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
      <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
      <meta name="theme-color" content="#060A12" media="(prefers-color-scheme: dark)" />
      <meta name="theme-color" content="#F5F3FA" media="(prefers-color-scheme: light)" />
      <link rel="canonical" href="https://getvents.com" />

      <!-- Open Graph -->
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="VENTS" />
      <meta property="og:url" content="https://getvents.com" />
      <meta property="og:title" content="VENTS" />
      <meta property="og:description" content="Discover and book events in Nigeria with a user-friendly platform that offers ticket purchasing, event categories, and personalized recommendations." />
      <meta property="og:image" content="https://getvents.com/og-image.png" />
      <meta property="og:image:secure_url" content="https://getvents.com/og-image.png" />
      <meta property="og:image:type" content="image/png" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta property="og:image:alt" content="VENTS - Discover and book events in Nigeria" />

      <!-- Twitter / X Card -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="VENTS" />
      <meta name="twitter:description" content="Discover and book events in Nigeria with a user-friendly platform that offers ticket purchasing, event categories, and personalized recommendations." />
      <meta name="twitter:image" content="https://getvents.com/og-image.png" />
      <meta name="twitter:image:alt" content="VENTS - Discover and book events in Nigeria" />

      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <!-- Primary UI fonts. Moved here out of src/styles/index.css's @import
           so the preload scanner finds them during the initial document
           parse and fetches them in parallel with the app stylesheet,
           instead of in a second round trip chained behind it. Weights are
           unchanged from what index.css requested. -->
      <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
      <!-- Outfit is used by exactly ONE element in the whole app — the event
           title on EventDetailsScreen (EventDetailsScreen.tsx:814) — and
           that element renders at `fontWeight: 700`. This request previously
           asked for six weights (300;400;500;600;700;800), so five font
           files were fetched on every single page load and never painted.
           Narrowed to the one weight actually rendered: byte-for-byte
           identical output, five fewer unused font downloads. -->
      <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">

      <!-- Paystack Inline Payment SDK.
           `defer` (added for performance) does NOT weaken any payment
           guarantee this tag previously provided, and deliberately stops
           short of `async`:
             * Without it, this is a synchronous third-party <script> in
               <head>, so HTML parsing — and therefore first paint — blocks on
               a round trip to js.paystack.co for EVERY visitor, including the
               landing page, the legal pages, and the large majority who never
               reach checkout.
             * A deferred classic script is still fetched immediately and is
               still guaranteed to execute before DOMContentLoaded, and
               deferred classic scripts and module scripts execute in DOCUMENT
               ORDER. This tag precedes /src/main.tsx (a module script, which
               is deferred by default) below, so `window.PaystackPop` is still
               defined before the app module ever runs — the exact ordering
               that held before. `async` would break that ordering, which is
               why it is not used here.
             * Every consumer additionally reaches this only on an explicit
               user action, seconds later at the earliest, and already guards
               on `window.PaystackPop` first (CheckoutScreen.tsx:331,
               PaymentRequestScreen.tsx:118, src/lib/paystack.ts) — so the
               pre-existing "script hasn't loaded" path is untouched.
           Net: no change to payment initialization, one less render-blocking
           request on the critical path. -->
      <script defer src="https://js.paystack.co/v1/inline.js"></script>
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
